name: main_app_package
description: >-
  Cờ Caro (Flame) — màn sạch của shell cho com.gamevee.th2.
publish_to: 'none'
version: 1.0.0

environment:
  # CHỈ Flutter của engine (../engine/flutter-framework, CLAUDE.md §1): Flutter
  # khác version bị pub từ chối ngay, không kịp ghi lại pubspec.lock.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  audioplayers: ^6.5.1
  google_fonts: ^6.2.1
  isolate_manager: ^6.3.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.0
  share_plus: ^10.1.2
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/
