name: app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.4+4

environment:
  # CHỈ Flutter của engine (../engine/flutter-framework, CLAUDE.md §1): Flutter
  # khác version bị pub từ chối ngay, không kịp ghi lại pubspec.lock.
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  loading_kit:
    path: ../loading_kit/loading_kit
  # UI màn "sạch" (main app) — package NGOÀI repo, XUẤT từ apps/<bundleId>/main_app
  # (hoặc apps/_reference/main_app) bằng tools/cmd/build_main_app.sh.
  # Contract: export `MainAppScreen` + `mainAppMeta`. CÓ Ở CẢ 2 MODE (nó là
  # UI nộp store). Đổi diện mạo app = sửa apps/<bundleId>/main_app + chạy lại tool, code
  # app/boot không đụng vào.
  main_app_package:
    path: ../../main_app_package
  shared_preferences: ^2.5.3
  # --- module-only deps (KHONG vao ban release) ---
  # Entry wrapper module nam o ../app_package/modules/home_content.dart va duoc
  # compile bang package_config CUA HOST (dynmod.sh module) de dart2bytecode thay
  # duoc cay noi dung. Host KHONG import file do nen tree-shake loai khoi
  # libapp.so release.
  content_kit:
    path: ../loading_kit/content_kit
  flutter_riverpod: ^2.5.1
  # API runtime loadModuleFromBytes + Registry — lay tu checkout dynmod engine
  # (tools/cmd/dynmod.sh cung tu dong sua path nay truoc moi lan build).
  dynamic_modules:
    path: ../../engine/flutter/third_party/dart/pkg/dynamic_modules
  # Gate module runtime (check/tải/verify/load) dùng bởi
  # shell/dynmod_gate_impl.dart.
  dyn_loader:
    path: ../loading_kit/dyn_loader
  # Restart app khi user bấm OK ở popup "cập nhật version mới thành công"
  # (shell/boot_shell.dart) — CHỈ Android: relaunch activity + engine mới.
  # iOS TẮT app (exit(0)) thay cho restart → KHÔNG cấu hình native gì thêm
  # (không còn `RestartAppPlugin.configureEngineRestart` trong AppDelegate).
  restart_app: ^1.10.1
  # >>> app_package:module-only (tam G1, G6 don sach khi module hoa xong)
  app_package:
    path: ../../app_package
  # <<< app_package:module-only
  # ^9.0.1: app_package yêu cầu tối thiểu 9.x (loading_kit cũng đã bump theo).
  package_info_plus: ^9.0.1
  # --- deps B goi mat Dart + co native, host phai nuong san ---
  # google_fonts: B dung trong app_text_styles + mini/diamond (tai font runtime).
  google_fonts: ^6.2.1
  # isolate_manager: B dung trong ws_isolate_processor/worker (socket isolate).
  isolate_manager: ^6.1.2
  # hive + hive_flutter: B dung SbConfigCache/asset_storage/search storage.
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # >>> native-prebundle:begin (LUÔN có — module chỉ mang code Dart) >>>
  # Native plugin pre-bundle cho module chứa `app_package`: module CHỈ mang được
  # code Dart — native (Kotlin/Swift) của plugin KHÔNG bay tới máy user bằng
  # module. Nên bản host phải biên dịch sẵn MỌI plugin native mà code Dart
  # của app_package gọi platform channel, nếu không sau khi nạp module game
  # sẽ crash MissingPluginException.
  # Danh sách này = cây plugin của ../app_package (bắt buộc khớp version
  # constraint với pubspec của app_package). Verify bằng:
  #   bash tools/check.sh
  audioplayers: ^6.5.1
  cached_network_image: ^3.4.1        # → flutter_cache_manager → sqflite (native)
  clarity_flutter: ^1.9.0
  connectivity_plus: ^6.1.0
  device_info_plus: ^11.5.0
  flutter_inappwebview: ^6.1.5
  # Plugin internal của app_package (fork InAppWebView cho IH game) — có native
  # android/. Path trỏ vào ../app_package: thư mục app_package PHẢI tồn tại ở
  # máy build kể cả lúc build release (chỉ lấy native, Dart bị tree-shake).
  game_engine:
    path: ../../app_package/packages/game_engine
  path_provider: ^2.1.0
  pointer_interceptor: ^0.10.1
  rive: ^0.14.9
  sentry_flutter: ^9.24.0
  sqflite: ^2.4.2
  url_launcher: ^6.2.5
  video_player: ^2.9.2
  wakelock_plus: ^1.4.0
  webview_flutter: ^4.11.2
  webview_flutter_wkwebview: ^3.23.7
  # <<< native-prebundle:end <<<


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # iOS plugin qua CocoaPods, KHÔNG Swift Package Manager: bản SPM của
  # rive_native link thư viện tĩnh KHÔNG -force_load → hàm C cho FFI
  # (init, loadRiveFile…) bị linker bỏ → "dlsym … symbol not found" lúc chạy.
  # Podspec của rive_native có -force_load + tự tải thư viện native.
  config:
    enable-swift-package-manager: false

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
